<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation 2: Live Wall Swatch Recoloring - Diamond Paints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

  <style>
    :root {
      --phone-w: 393px;
      --phone-h: 852px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .embed-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mockup-wrapper {
      transform: scale(var(--embed-scale, 0.72));
      transform-origin: center center;
      /* No shadow behind phone */
    }

    .iphone-frame {
      width: var(--phone-w);
      height: var(--phone-h);
      background: #000;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 
        inset 0 0 0 2px #444a56,
        inset 0 0 0 5px #1a1e24,
        0 0 0 3px #2d333e,
        0 0 0 5px #0f1318;
      position: relative;
    }

    .screen-viewport {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }

    .island-cam {
      width: 11px;
      height: 11px;
      background: radial-gradient(circle at 40% 40%, #152238 0%, #05080e 70%);
      border-radius: 50%;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: #ffffff;
      border-radius: 3px;
      z-index: 100;
      opacity: 0.65;
      pointer-events: none;
    }

    /* THE PHYSICAL WALL SHAPE (Behind sofa, furniture & floor) */
    #physical-wall {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 590px;
      background-color: #b19cbf; /* Default Lilac */
      z-index: 1;
      transition: background-color 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Cutout layer with furniture & UI */
    #layer-cutout {
      position: absolute;
      inset: 0;
      background-image: url('assets/screen_3_transparent_wall.png');
      background-size: cover;
      background-position: top center;
      z-index: 2;
      pointer-events: none;
    }

    /* Active Shade Floating Toast */
    .shade-toast {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 24, 34, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 30;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shade-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #b19cbf;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
      transition: background-color 0.3s;
    }

    .shade-text {
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    /* Interactive Swatch Hotspots */
    .swatch-hotspot {
      position: absolute;
      bottom: 78px;
      width: 34px;
      height: 38px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 45;
    }

    /* Touch Gestures */
    .touch-finger {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(2, 101, 194, 0.45) 60%, transparent 80%);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 16px rgba(0, 153, 255, 0.85);
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    .touch-ripple {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2.5px solid rgba(0, 153, 255, 0.9);
      pointer-events: none;
      z-index: 998;
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="embed-wrapper">
    <div class="mockup-wrapper">
      <div class="iphone-frame">
        <div class="screen-viewport">
          
          <!-- Dynamic Island -->
          <div class="dynamic-island">
            <div class="island-cam"></div>
          </div>

          <!-- THE PHYSICAL WALL SHAPE BEHIND FURNITURE -->
          <div id="physical-wall"></div>

          <!-- Cutout Layer with Furniture, Plant, Floor, and Swatch Palette -->
          <div id="layer-cutout"></div>

          <!-- Floating Shade Toast -->
          <div class="shade-toast" id="shade-toast">
            <div class="shade-dot" id="shade-dot"></div>
            <span class="shade-text" id="shade-text">Lilac Purple &bull; D-304</span>
          </div>

          <!-- Swatch Hotspots (Clickable by website visitor too!) -->
          <div class="swatch-hotspot" id="swatch-yellow" style="left: 77px;" data-color="#f5e6b8" data-name="Yellow Sand &bull; D-201" title="Yellow Sand"></div>
          <div class="swatch-hotspot" id="swatch-tan" style="left: 114px;" data-color="#d9b896" data-name="Warm Tan &bull; D-402" title="Warm Tan"></div>
          <div class="swatch-hotspot" id="swatch-purple" style="left: 152px;" data-color="#b19cbf" data-name="Lilac Purple &bull; D-304" title="Lilac Purple"></div>
          <div class="swatch-hotspot" id="swatch-peach" style="left: 189px;" data-color="#f0c2b2" data-name="Soft Peach &bull; D-108" title="Soft Peach"></div>
          <div class="swatch-hotspot" id="swatch-blue" style="left: 226px;" data-color="#70a9d4" data-name="Sky Blue &bull; D-702" title="Sky Blue"></div>
          <div class="swatch-hotspot" id="swatch-mint" style="left: 263px;" data-color="#bce3cf" data-name="Mint Green &bull; D-505" title="Mint Green"></div>

          <!-- Touch Gestures -->
          <div class="touch-finger" id="finger"></div>
          <div class="touch-ripple" id="ripple"></div>

          <!-- iOS Indicator -->
          <div class="home-indicator"></div>

        </div>
      </div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(CustomEase);
    CustomEase.create("softLanding", "M0,0 C0.16,1 0.3,1 1,1");

    const physicalWall = document.getElementById('physical-wall');
    const shadeDot = document.getElementById('shade-dot');
    const shadeText = document.getElementById('shade-text');
    const finger = document.getElementById('finger');
    const ripple = document.getElementById('ripple');
    const swatches = document.querySelectorAll('.swatch-hotspot');

    function applyWallColor(hex, name) {
      physicalWall.style.backgroundColor = hex;
      shadeDot.style.backgroundColor = hex;
      if (name) shadeText.innerHTML = name;
    }

    function snappyTap(x, y) {
      const tl = gsap.timeline();
      tl.set(finger, { left: x, top: y, scale: 0, opacity: 0 })
        .set(ripple, { left: x, top: y, scale: 0.2, opacity: 0 })
        .to(finger, { scale: 0.95, opacity: 1, duration: 0.12, ease: "softLanding" })
        .to(ripple, { scale: 1.8, opacity: 0.9, duration: 0.05 }, "-=0.03")
        .to(ripple, { scale: 2.5, opacity: 0, duration: 0.18, ease: "power2.out" })
        .to(finger, { scale: 0, opacity: 0, duration: 0.1, ease: "power2.in" }, "-=0.12");
      return tl;
    }

    // Auto-flow Timeline: Smoothly cycles through shades
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.0 });

    tl.call(() => applyWallColor('#b19cbf', 'Lilac Purple &bull; D-304'))
      .to({}, { duration: 0.8 })

      // Tap 1: Warm Tan (x: 130, y: 800)
      .add(snappyTap(130, 800))
      .call(() => applyWallColor('#d9b896', 'Warm Tan &bull; D-402'))
      .to({}, { duration: 1.4 })

      // Tap 2: Soft Peach (x: 205, y: 800)
      .add(snappyTap(205, 800))
      .call(() => applyWallColor('#f0c2b2', 'Soft Peach &bull; D-108'))
      .to({}, { duration: 1.4 })

      // Tap 3: Sky Blue (x: 242, y: 800)
      .add(snappyTap(242, 800))
      .call(() => applyWallColor('#70a9d4', 'Sky Blue &bull; D-702'))
      .to({}, { duration: 1.4 })

      // Tap 4: Mint Green (x: 280, y: 800)
      .add(snappyTap(280, 800))
      .call(() => applyWallColor('#bce3cf', 'Mint Green &bull; D-505'))
      .to({}, { duration: 1.4 });

    // Interactive clicking for visitors
    swatches.forEach(swatch => {
      swatch.addEventListener('click', (e) => {
        tl.pause();
        const color = swatch.getAttribute('data-color');
        const name = swatch.getAttribute('data-name');
        applyWallColor(color, name);
      });
    });

    // Auto-scale for iframe
    function resizeMockup() {
      const h = window.innerHeight;
      const w = window.innerWidth;
      const scaleH = (h * 0.92) / 852;
      const scaleW = (w * 0.92) / 393;
      const scale = Math.min(scaleH, scaleW, 0.9);
      document.querySelector('.mockup-wrapper').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeMockup);
    resizeMockup();
  </script>
</body>
</html>
